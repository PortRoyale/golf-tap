    const r2 = box.getBoundingClientRect(), n = rows.length, gap = 10, headH = 44;
    let best = { c: 1, s: 0 };
    for (let c = 1; c <= n; c++) { const rr = Math.ceil(n / c), s2 = Math.min((r2.width - gap * (c - 1)) / c, (r2.height - gap * (rr - 1)) / rr - headH); if (s2 > best.s) best = { c, s: s2 }; }
    grid.style.gridTemplateColumns = 'repeat(' + best.c + ', ' + Math.floor(best.s) + 'px)';
    grid.innerHTML = rows.map((x, i) => {
      const meas = x.mode === 'discovery' && x.rating !== undefined ? (x.measure === 'finish' ? 'Carries ' + f(x.shots.reduce((a, q) => a + q.land, 0) / x.shots.length) + ', stops at ' + f(x.targetYd + x.depthOffsetYd) : 'Really carries ' + f(x.targetYd + x.depthOffsetYd) + ' yd') : (x.rating !== undefined ? 'Miss ' + f(x.piQ * 100, 1) + '%' : x.n + ' shot' + (x.n === 1 ? '' : 's') + ', not scored');
      const oc = x.outcomes && x.mode !== 'discovery' ? (x.outcomes.kind === 'fairway' ? x.outcomes.fairway + ' of ' + x.outcomes.n + ' in the fairway' : x.outcomes.in20ft + ' of ' + x.outcomes.n + ' inside 20 ft') : '';
      const nx = (x.list || []).filter(q => q.excluded).length;
      const ul = usualLine(x);
      return '<button type="button" class="mini' + (x.tiedForLast ? ' weak' : '') + '" data-row="' + i + '" style="height:' + Math.floor(best.s + headH) + 'px"><div class="h"><b>' + esc(rowName(x)) + ' <span class="faint" style="font-weight:400;font-size:12.5px">' + (x.mode === 'discovery' ? 'learning its distance' : 'to ' + f(x.targetYd)) + '</span></b>' + (x.tiedForLast ? '<span class="tag">Practice</span>' : '<span class="faint num">' + (x.rating !== undefined && x.mode !== 'discovery' ? f(x.rating) : '') + '</span>') + '</div><div class="m" data-i="' + i + '"></div><div class="c">' + meas + (oc ? ', ' + oc : ', ' + x.n + ' shots') + (nx ? ', ' + nx + ' removed' : '') + '</div>' + (ul ? '<div class="c" style="color:var(--chalk-2)">' + esc(ul[0].toUpperCase() + ul.slice(1)) + '</div>' : '') + '</button>';
    }).join('');
    $$('.mini .m', grid).forEach(el => {
      const x = rows[Number(el.dataset.i)], rr = el.getBoundingClientRect();
      const ell = (x.contours || []).filter(c => c.p === 0.5 || c.p === 0.9).map(c => ({ p: c.p, rx: c.rx, ry: c.ry, theta: c.theta }));
      const center = x.rating !== undefined ? { x: x.muXYd, y: x.targetYd + (x.mode === 'discovery' ? x.depthOffsetYd : 0) + x.muYYd } : null;
      el.innerHTML = drawMap({ shots: x.shots, target: x.targetYd, ell, center, W: Math.floor(rr.width), H: Math.floor(rr.height), mini: true });
    });
    $$('[data-row]', grid).forEach(b => b.onclick = () => resultShots(rows[Number(b.dataset.row)], v));
    return grid.innerHTML;
  };
  FIT.push(layMinis); layMinis();
  const tabs = () => { const rb = $('#rankbox'); if (!rb) return; rb.dataset.tabHidden = RES.tab === 'rank' ? '0' : '1'; box.dataset.tabHidden = RES.tab === 'land' ? '0' : '1'; };
  $$('#rtab button').forEach(b => b.onclick = () => { RES.tab = b.dataset.t; $$('#rtab button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); tabs(); });
  tabs();
  const ss = $('#sessSel'); if (ss) ss.onchange = () => go('#/results?session=' + ss.value);
  const ds = $('#delsess');
  if (ds) ds.onclick = () => {
    const n = rows.reduce((a, x) => a + (x.list || []).length, 0);
    $('#delbox').innerHTML = '<span class="err" style="margin-right:6px">Delete this session and its ' + n + ' shots for good?</span><button class="btn" id="delyes">Delete</button><button class="btn quiet" id="delno">Keep it</button>';
    $('#delno').onclick = () => renderResults(v);
    $('#delyes').onclick = async () => { await post('/api/session/' + res.session.id + '/delete'); go('#/results'); renderResults(v); };
  };
  const d = $('#drill'); if (d) d.onclick = async () => { await post('/api/start', { kind: 'free', club: weak[0].club, targetYd: weak[0].targetYd }); go('#/practice'); };
}

/** Every shot of one club in the results, with Remove (keeps it, leaves it out of the score) and Delete (gone). */
function resultShots(row, v, page = 0) {
  const shots = row.list || [];
  const per = 12, pages = Math.max(1, Math.ceil(shots.length / per)), pg = Math.max(0, Math.min(pages - 1, page));
  const list = shots.slice(pg * per, pg * per + per);
  const old = $('.sheet'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'sheet';
  const t = (iso) => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  el.innerHTML = '<div class="card" role="dialog" aria-label="Shots"><div class="row"><h2 style="margin:0">' + esc(rowName(row)) + ' to ' + f(row.targetYd) + ' yd</h2><button class="btn quiet" id="shclose">Close</button></div>' +
    '<p class="faint" style="margin:6px 0 10px">Remove leaves a shot out of every score and can be undone. Delete takes it out of Pattern for good.</p>' +
    '<table class="t"><thead><tr><th>When</th><th>Carry</th><th>Total</th><th>To target</th><th>Offline</th><th></th></tr></thead><tbody>' +
    list.map(s => '<tr class="' + (s.excluded ? 'x' : '') + '"><td>' + t(s.at) + '</td><td>' + f(s.carryYd, 1) + '</td><td>' + f(s.totalYd, 1) + '</td><td>' + (s.depthYd > 0 ? '+' : '') + f(s.depthYd, 1) + '</td><td>' + side(s.offlineYd) + '</td><td style="white-space:nowrap"><button class="btn quiet" data-ex="' + s.id + '" data-v="' + (s.excluded ? 0 : 1) + '">' + (s.excluded ? 'Put back' : 'Remove') + '</button><button class="btn quiet" data-del="' + s.id + '">Delete</button></td></tr>').join('') +
    '</tbody></table>' + (pages > 1 ? '<div class="row" style="margin-top:10px"><button class="btn quiet" id="shprev"' + (pg ? '' : ' disabled') + '>Earlier</button><span class="faint">Page ' + (pg + 1) + ' of ' + pages + '</span><button class="btn quiet" id="shnext"' + (pg < pages - 1 ? '' : ' disabled') + '>Later</button></div>' : '') + '</div>';
  document.body.appendChild(el);
  const close = () => { el.remove(); renderResults(v); };
  el.onclick = (e) => { if (e.target === el) close(); };
  $('#shclose', el).onclick = close;
  const pv = $('#shprev', el); if (pv) pv.onclick = () => resultShots(row, v, pg - 1);
  const nx = $('#shnext', el); if (nx) nx.onclick = () => resultShots(row, v, pg + 1);
  $$('[data-ex]', el).forEach(b => b.onclick = async () => { const on = b.dataset.v === '1'; await post('/api/shot/' + b.dataset.ex + '/exclude', { excluded: on, why: 'removed in results' }); const s = shots.find(q => String(q.id) === b.dataset.ex); if (s) s.excluded = on; resultShots(row, v, pg); });
  $$('[data-del]', el).forEach(b => b.onclick = async () => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Sure? Delete'; b.classList.add('danger'); return; }
    await post('/api/shot/' + b.dataset.del + '/delete'); row.list = shots.filter(q => String(q.id) !== b.dataset.del); resultShots(row, v, pg);
  });
}

// ---------------------------------------------------------------- history
let histPick = null, HIST = { axis: 'depth', tab: 'score' };
async function renderHistory(v) {
  const h = await api('/api/history');
  if (!route.startsWith('#/history')) return;
  fitReset();
  const labs = h.labels.filter(l => l.points.length);
  if (!labs.length) { v.innerHTML = '<div class="empty"><h2>Your progress shows here</h2><p style="margin:0 auto 18px">After two or more sessions with the same club and target, this shows whether you\'re actually getting better, and by how much.</p><a class="btn primary" href="#/practice">Start practicing</a></div>'; return; }
  if (!histPick || !labs.some(l => l.id === histPick)) histPick = [...labs].sort((a, b) => b.points.length - a.points.length)[0].id;
  const L = labs.find(l => l.id === histPick), pts = L.points;
  const pick = '<div class="picker">' + labs.map(l => '<button class="chip" data-id="' + l.id + '" aria-pressed="' + (l.id === histPick) + '">' + esc(clubName(l.club)) + ' ' + f(l.targetYd) + (l.shape !== 'stock' ? ' ' + esc(l.shape) : '') + '</button>').join('') + '</div>';
  let summary;
  if (pts.length < 2) summary = 'One session so far: ' + f(pts[0].rating) + ' ± ' + f(pts[0].rd) + '. Come back after another to see a trend.';
  else if (L.trend && L.trend.detectable) summary = (L.trend.perMonth > 0 ? 'Getting better: ' : 'Slipping: ') + (L.trend.perMonth > 0 ? '+' : '') + f(L.trend.perMonth) + ' points a month (between ' + f(L.trend.lo) + ' and ' + f(L.trend.hi) + ').';
  else summary = 'No detectable change in score yet' + (L.trend ? ' (somewhere between ' + f(L.trend.lo) + ' and ' + f(L.trend.hi) + ' points a month)' : '') + '.';
  if (pts.length >= 2 && pts[0].depth) {
    const a = pts[0], b = pts[pts.length - 1], d0 = new Date(a.date).toLocaleDateString([], { month: 'short', day: 'numeric' });
    summary += ' Your pattern: ±' + f(b.depth.sd, 1) + ' yd long and short and ±' + f(b.offline.sd, 1) + ' left and right, against ±' + f(a.depth.sd, 1) + ' and ±' + f(a.offline.sd, 1) + ' on ' + d0 + '.';
  }
  v.innerHTML = '<h1>' + esc(clubName(L.club)) + ' to ' + f(L.targetYd) + ' yards, over time</h1>' + pick +
    '<p class="verdict" style="font-size:clamp(14px,2.2vh,19px)">' + summary + '</p>' +
    '<div class="seg tabsel" id="htab"><button data-t="score" aria-pressed="' + (HIST.tab === 'score') + '">Score</button><button data-t="pattern" aria-pressed="' + (HIST.tab === 'pattern') + '">Pattern</button></div>' +
    '<div class="hist"><div class="chartbox" id="hs"><h2>Score <span class="faint">each session is a hill: centred on its score, as wide as the doubt. The dashed line is your best estimate of your real level.</span></h2><div class="fill" id="tscore"></div></div>' +
    '<div class="chartbox" id="hp"><h2>' + (L.measure === 'finish' ? 'Where it stops' : 'Where it lands') + ' <span class="seg" id="axsel" style="margin-left:6px"><button data-a="depth" aria-pressed="' + (HIST.axis === 'depth') + '">Long / short</button><button data-a="offline" aria-pressed="' + (HIST.axis === 'offline') + '">Left / right</button></span><span class="faint">a narrow, bright ridge is a consistent day, wherever it sits</span></h2><div class="fill" id="tpat"></div></div></div>' +
    '<div class="foot"><span>Your current number rests on about ' + f(L.nEffShots) + ' shots\' worth of information' + (L.totalShots > L.nEffShots + 1 ? ' (older shots count for less as your game changes)' : '') + '.</span><span class="sp"></span><span>Gaps between sessions are drawn to scale.</span></div>';
  const T = (q) => Date.parse(q.date);
  fitBox($('#tscore'), (W, H) => terrain({ W, H, label: 'Score over time', pts: pts.map(q => ({ t: T(q), mu: q.rating, sd: q.rd })), line: L.filtered && pts.length > 1 ? pts.map(q => ({ t: T(q), v: q.est })) : null }));
  const pat = () => fitBox($('#tpat'), (W, H) => terrain({ W, H, label: 'Where the shots land over time', pts: pts.filter(q => q[HIST.axis]).map(q => ({ t: T(q), mu: q[HIST.axis].mu, sd: Math.max(0.3, q[HIST.axis].sd) })), ref: 0, refLabel: HIST.axis === 'depth' ? 'pin' : 'line', yfmt: (y) => y === 0 ? '0' : HIST.axis === 'depth' ? Math.abs(y) + (y > 0 ? ' long' : ' short') : Math.abs(y) + (y > 0 ? ' R' : ' L') }));
  pat();
  $$('#axsel button').forEach(b => b.onclick = () => { HIST.axis = b.dataset.a; $$('#axsel button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); fitReset(); renderHistory(v); });
  const tabs = () => { $('#hs').dataset.tabHidden = HIST.tab === 'score' ? '0' : '1'; $('#hp').dataset.tabHidden = HIST.tab === 'pattern' ? '0' : '1'; };
  $$('#htab button').forEach(b => b.onclick = () => { HIST.tab = b.dataset.t; $$('#htab button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); tabs(); });
  tabs();
  $$('.picker .chip', v).forEach(b => b.onclick = () => { histPick = Number(b.dataset.id); renderHistory(v); });
}

// ---------------------------------------------------------------- bag page
async function renderBag(v) {
  await refreshState();
  fitReset();
  bagDraft = null;
  v.innerHTML = '<h1>' + esc(S.player) + '\'s bag</h1><p class="lead baglead">Carry on a good strike. After a "Find my real numbers" session, Pattern updates these from what you actually hit.</p>' +
    '<div class="row" style="margin:calc(var(--u) * 0.6) 0 calc(var(--u) * 0.4)"><span class="dim">Score each shot on</span><div class="seg" id="scoreon"><button data-on="finish" aria-pressed="' + (S.scoreOn !== 'carry') + '">Where it stops</button><button data-on="carry" aria-pressed="' + (S.scoreOn === 'carry') + '">Where it lands</button></div><span class="faint">Roll-out comes from GSPro.</span><span class="dim" style="margin-left:12px">Fairway width</span><input class="input num" id="fwy" type="number" min="10" max="80" style="width:76px;padding:6px 8px" value="' + (S.fairwayYd || 30) + '" aria-label="Fairway width in yards"><span class="faint">yd</span></div>' +
    '<div id="bagbox">' + bagEditor() + '</div><div class="row" style="margin-top:calc(var(--u) * 1.6)"><button class="btn primary" id="savebag">Save bag</button><span class="faint" id="bagmsg"></span></div>' +
    '<p class="dim bagsetup" style="margin-top:calc(var(--u) * 1.6)">Setup: ' + esc(S.setup.sim) + ' ' + esc(S.setup.simVersion || '(version not entered)') + ' · ' + esc(S.setup.conditions) + '. <a href="#/setup/1">Run setup again</a></p>' +
    '<div class="datazone row" id="datazone" data-small="1"><span class="dim" id="datacount">Your data</span><button class="btn quiet" id="reset">Delete all of ' + esc(S.player) + '\'s shots and start over</button></div>';
  wireBag(v);
  api('/api/data').then(d => { const c = $('#datacount'); if (c) c.textContent = d.player + ' has ' + d.shots + ' shot' + (d.shots === 1 ? '' : 's') + ' in ' + d.sessions + ' session' + (d.sessions === 1 ? '' : 's') + '.'; });
  $('#reset').onclick = () => {
    $('#datazone').innerHTML = '<span class="err">Delete every session and shot for ' + esc(S.player) + '? This can\'t be undone. Other players and the raw capture files are kept.</span><label class="row" style="gap:6px"><input type="checkbox" id="resetbag" checked> Also forget the measured numbers in the bag (keeps your typed carries)</label><button class="btn danger" id="resetyes">Delete and start over</button><button class="btn quiet" id="resetno">Keep everything</button>';
    $('#resetno').onclick = () => renderBag(v);
    $('#resetyes').onclick = async () => { await post('/api/player/reset', { bag: $('#resetbag').checked }); await refreshState(); renderBag(v); };
  };
  const fw = $('#fwy'); if (fw) fw.onchange = async () => { await post('/api/scoreon', { fairwayYd: Number(fw.value) }); await refreshState(); };
  $$('#scoreon button').forEach(b => b.onclick = async () => { await post('/api/scoreon', { on: b.dataset.on }); await refreshState(); $$('#scoreon button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
  $('#savebag').onclick = async () => { await post('/api/bag', { bag: bagDraft }); await refreshState(); $('#bagmsg').textContent = 'Saved.'; if (!S.onboarded) go('#/setup/6'); };
}

// ---------------------------------------------------------------- add a player
function addPlayerSheet() {
  const old = $('.sheet'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'sheet';
  const has = (S.bag || []).length;
  el.innerHTML = '<div class="card" role="dialog" aria-label="Add a player" style="width:min(520px, calc(100vw - 32px))"><div class="row"><h2 style="margin:0">Add a player</h2><span class="sp" style="flex:1"></span><button class="btn quiet" id="apclose">Cancel</button></div>' +
    '<p class="faint" style="margin:6px 0 14px">Each player has their own bag, scores and history. Switch any time from the Player menu.</p>' +
    '<div class="stack"><label class="field"><span>Name</span><input class="input" id="apname" autocomplete="off" placeholder="Their name"></label>' +
    '<div class="field"><span>Hand</span><div class="seg" id="aphand"><button type="button" data-h="R" aria-pressed="true">Right-handed</button><button type="button" data-h="L" aria-pressed="false">Left-handed</button></div></div>' +
    (has ? '<div class="field"><span>Bag</span><div class="seg" id="apbag"><button type="button" data-b="copy" aria-pressed="true">Start from ' + esc(S.player) + '\'s clubs</button><button type="button" data-b="empty" aria-pressed="false">Empty bag</button></div><span class="faint" style="font-size:13px">Copied distances are only a starting guess. They don\'t count toward scores until this player\'s own shots measure them.</span></div>' : '') +
    '</div><div class="row" style="margin-top:18px"><button class="btn primary" id="apgo">Add and switch</button><span class="err" id="aperr"></span></div></div>';
  document.body.appendChild(el);
  const seg = (id) => $$('#' + id + ' button', el).forEach(b => b.onclick = () => $$('#' + id + ' button', el).forEach(x => x.setAttribute('aria-pressed', String(x === b))));
  seg('aphand'); seg('apbag');
  $('#apclose', el).onclick = () => el.remove();
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  $('#apname', el).focus();
  const go2 = async () => {
    const name = $('#apname', el).value.trim();
    if (!name) { $('#aperr', el).textContent = 'Enter a name.'; return; }
    if ((S.players || []).includes(name)) { $('#aperr', el).textContent = name + ' is already a player. Pick them from the Player menu.'; return; }
    const bagB = $('#apbag [aria-pressed="true"]', el);
    await post('/api/player', { name, handed: $('#aphand [aria-pressed="true"]', el).dataset.h, copyBag: !!bagB && bagB.dataset.b === 'copy' });
    el.remove();
    await refreshState();
    go((S.bag || []).length ? '#/practice' : '#/bag');
    render();
  };
  $('#apgo', el).onclick = go2;
  $('#apname', el).onkeydown = (e) => { if (e.key === 'Enter') go2(); };
}

// ---------------------------------------------------------------- demo bar
// Only in the demo copy: buttons that stand in for swinging.
let DEMO_BUSY = false;
function paintDemo() {
  const bar = $('#demobar');
  if (!S || !S.demo) { if (bar) bar.remove(); return; }
  if (!bar) {
    const el = document.createElement('div');
    el.id = 'demobar'; el.className = 'demobar';
    document.body.insertBefore(el, $('#view'));
  }
  const b = $('#demobar');
  const h = '<span><b>Demo.</b> No launch monitor needed: these buttons swing for you. Your real data is untouched.</span><span class="sp"></span>' +
    '<button class="btn" data-demo="hello">Connect the pretend monitor</button><button class="btn primary" data-demo="hit" data-n="1">Hit a shot</button><button class="btn" data-demo="hit" data-n="5">Hit 5</button><button class="btn" data-demo="hit" data-push="1">Push one right</button>' +
    (S.onboarded ? '<button class="btn" data-demo="weeks">Add six weeks of history</button>' : '') + '<span class="faint" id="demost"></span>';
  if (b.dataset.h !== h) { b.innerHTML = h; b.dataset.h = h; $$('[data-demo]', b).forEach(x => x.onclick = () => demoDo(x.dataset.demo, Number(x.dataset.n) || 1, !!x.dataset.push)); }
}
async function demoDo(what, n, push) {
  if (DEMO_BUSY) return;
  DEMO_BUSY = true;
  $$('[data-demo]').forEach(x => x.disabled = true);
  const r = await post('/api/demo/' + what, { n, push });
  const st = $('#demost');
  if (r && r.ok === false && st) st.textContent = r.reason || '';
  for (;;) {
    const s = await api('/api/demo/status');
    if (st) st.textContent = s.running ? (s.what === 'weeks' ? 'Playing six weeks of sessions… ' + s.done + ' of ' + s.total + ' shots' : s.what === 'hit' ? 'Swinging… ' + s.done + ' of ' + s.total : 'Connecting…') : (s.error ? s.error : '');
    if (!s.running) break;
    await new Promise(r => setTimeout(r, 400));
  }
  DEMO_BUSY = false;
  $$('[data-demo]').forEach(x => x.disabled = false);
  await refreshState();
  if (what === 'weeks') go('#/history');
}
async function openDemo(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Starting the demo…'; }
  const r = await post('/api/demo/start');
  if (btn) { btn.disabled = false; btn.textContent = 'Try it with pretend shots'; }
  if (r && r.url) window.open(r.url, '_blank');
}

// ---------------------------------------------------------------- live updates
const es = new EventSource('/events');
let pending = null;
es.onmessage = (e) => {
  let ev; try { ev = JSON.parse(e.data); } catch { return; }
  if (!['shot', 'plan', 'exclude', 'learn', 'demo'].includes(ev.kind)) return;
  clearTimeout(pending);
  pending = setTimeout(() => { if (route.startsWith('#/practice')) renderPractice($('#view')); else if (route.startsWith('#/results') && ev.kind === 'plan') renderResults($('#view')); }, ev.kind === 'shot' ? 0 : 120);
};
setInterval(refreshState, 3000);
paintFs();
$('#fs').onclick = toggleFs;
$('#quit').onclick = async () => {
  if (S && S.demo) { window.close(); return; }
  try { await post('/api/quit'); } catch { /* it is already going */ }
  document.body.innerHTML = '<div class="empty" style="margin:auto"><h2>Pattern has stopped</h2><p style="margin:0 auto">Everything is saved. You can close this window; start golf-tap again to come back.</p></div>';
  setTimeout(() => window.close(), 600);
};
refreshState().then(render);
checkUpdate();
setInterval(checkUpdate, 15 * 60 * 1000);
</script>
