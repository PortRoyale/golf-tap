<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern</title>
<style>
@font-face { font-family: 'Inter'; src: url(/fonts/inter-400) format('opentype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Inter'; src: url(/fonts/inter-500) format('opentype'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'Inter'; src: url(/fonts/inter-600) format('opentype'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Inter Display'; src: url(/fonts/inter-display-600) format('opentype'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Lora'; src: url(/fonts/lora-italic) format('truetype'); font-style: italic; font-weight: 400 700; font-display: swap; }

:root {
  /* Night turf, chalk lines, one yellow flagstick. */
  --ink: #0f1a15;
  --turf: #16271e;
  --turf-2: #1c3226;
  --mow: #1f382b;
  --line: #2b4637;
  --chalk: #eceee4;
  --chalk-2: #b9c2b3;
  --chalk-3: #7f8d7f;
  --flag: #f2c14e;
  --miss: #e07a5f;
  --good: #8fd19e;
  --num: 'Bahnschrift SemiCondensed', 'Bahnschrift', 'Inter Display', 'Inter', system-ui, sans-serif;
  --ui: 'Inter', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  --note: 'Lora', Georgia, serif;
  --r-s: 6px;
  --r-m: 10px;
  /* One vertical rhythm unit that shrinks on short screens, so every screen fits without scrolling. */
  --u: clamp(6px, 1.25vh, 14px);
  --top: 56px;
  --pad-x: clamp(14px, 1.8vw, 28px);
}
* { box-sizing: border-box; }
/* The app never scrolls: every screen is laid out to the window. */
html, body { height: 100%; overflow: hidden; }
html { background: var(--ink); }
body { margin: 0; color: var(--chalk); font: 15px/1.45 var(--ui); background: var(--ink); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--flag); outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.dim { color: var(--chalk-2); }
.faint { color: var(--chalk-3); }

/* ---------- top bar ---------- */
.top { flex: none; display: flex; align-items: center; gap: 24px; padding: 0 var(--pad-x); height: var(--top); background: var(--ink); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--num); font-size: 22px; font-weight: 600; letter-spacing: 0.02em; display: flex; align-items: center; gap: 10px; }
.brand svg { display: block; }
.menu { display: flex; gap: 4px; }
.menu a { text-decoration: none; padding: 7px 14px; border-radius: var(--r-s); color: var(--chalk-2); font-weight: 500; }
.menu a:hover { color: var(--chalk); background: var(--turf); }
.menu a[aria-current="page"] { color: var(--chalk); background: var(--turf-2); }
.top .spacer { flex: 1; }
.status { display: flex; align-items: center; gap: 8px; color: var(--chalk-2); font-size: 13.5px; text-decoration: none; padding: 6px 10px; border-radius: var(--r-s); white-space: nowrap; }
.status:hover { background: var(--turf); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--chalk-3); flex: none; }
.dot.ok { background: var(--good); box-shadow: 0 0 0 3px rgba(143, 209, 158, 0.15); }
.dot.wait { background: var(--flag); }
.dot.bad { background: var(--miss); }
.player { display: flex; align-items: center; gap: 8px; }
.player select { background: var(--turf); border: 1px solid var(--line); border-radius: var(--r-s); padding: 6px 28px 6px 10px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--chalk-2) 50%), linear-gradient(135deg, var(--chalk-2) 50%, transparent 50%); background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; max-width: 160px; }
.debuglink { font-size: 13px; color: var(--chalk-3); text-decoration: none; }
.debuglink:hover { color: var(--chalk-2); }
.quitbtn { background: transparent; border: 0; cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
.update { font-size: 13px; color: var(--ink); background: var(--flag); border: 0; border-radius: 999px; padding: 5px 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.fs { background: transparent; border: 1px solid var(--line); border-radius: var(--r-s); width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; color: var(--chalk-2); flex: none; }
.fs:hover { color: var(--chalk); border-color: var(--chalk-3); }

/* Every view fills what is left of the window, exactly. */
main { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: calc(var(--u) * 2) var(--pad-x) calc(var(--u) * 1.6); }
.fill { flex: 1; min-height: 0; min-width: 0; position: relative; }

/* ---------- shared bits ---------- */
h1 { font-family: var(--num); font-weight: 600; font-size: clamp(24px, 4.2vh, 40px); line-height: 1.1; margin: 0 0 calc(var(--u) * 0.8); letter-spacing: 0.005em; }
h2 { font-weight: 600; font-size: clamp(14px, 2vh, 18px); margin: 0 0 calc(var(--u) * 0.8); }
p { margin: 0 0 calc(var(--u) * 1.1); max-width: 70ch; }
.lead { font-size: clamp(14px, 2vh, 17px); color: var(--chalk-2); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--turf); color: var(--chalk); border-radius: var(--r-s); padding: 9px 16px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--chalk-3); }
.btn.primary { background: var(--flag); color: #1b1606; border-color: var(--flag); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary:disabled { background: var(--turf-2); color: var(--chalk-3); border-color: var(--line); cursor: not-allowed; filter: none; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--chalk-2); }
.btn.quiet:hover { color: var(--chalk); border-color: var(--line); }
.btn:disabled { opacity: 0.45; cursor: default; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 13.5px; color: var(--chalk-2); }
.input { background: var(--turf); border: 1px solid var(--line); border-radius: var(--r-s); padding: 9px 12px; min-width: 0; }
.input:focus { border-color: var(--chalk-3); outline: none; }
.seg { display: inline-flex; background: var(--turf); border: 1px solid var(--line); border-radius: var(--r-s); padding: 3px; }
.seg button { background: transparent; border: 0; padding: 6px 16px; border-radius: 4px; color: var(--chalk-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--turf-2); color: var(--chalk); font-weight: 600; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stack > * + * { margin-top: calc(var(--u) * 1.4); }
.empty { margin: auto; border: 1px dashed var(--line); border-radius: var(--r-m); padding: 40px 28px; color: var(--chalk-2); text-align: center; max-width: 620px; }
.empty h2 { color: var(--chalk); }
.note { font-family: var(--note); font-style: italic; font-size: clamp(15px, 2.1vh, 18px); line-height: 1.45; color: var(--chalk); margin: 0; }
.err { color: var(--miss); }

/* ---------- setup wizard ---------- */
.wizard { flex: 1; min-height: 0; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
.rail { list-style: none; margin: 0; padding: 0; }
.rail li { display: flex; align-items: center; gap: 12px; padding: calc(var(--u) * 0.8) 0; color: var(--chalk-3); }
.rail li .n { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--num); font-size: 14px; flex: none; }
.rail li.done { color: var(--chalk-2); }
.rail li.done .n { background: var(--turf-2); border-color: var(--turf-2); color: var(--good); }
.rail li.here { color: var(--chalk); font-weight: 600; }
.rail li.here .n { border-color: var(--flag); color: var(--flag); }
.pane { max-width: 1080px; min-height: 0; display: flex; flex-direction: column; }
.pane > .btn, .pane > button { align-self: flex-start; }
.checks { list-style: none; padding: 0; margin: calc(var(--u) * 1.6) 0; border-top: 1px solid var(--line); max-width: 760px; }
.checks li { display: grid; grid-template-columns: 28px 1fr; gap: 14px; padding: calc(var(--u) * 1.1) 0; border-bottom: 1px solid var(--line); }
.checks .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; margin-top: 2px; }
.checks .ic.ok { background: rgba(143, 209, 158, 0.16); color: var(--good); }
.checks .ic.wait { background: rgba(242, 193, 78, 0.14); color: var(--flag); }
.checks .ic.bad { background: rgba(224, 122, 95, 0.16); color: var(--miss); }
.checks b { font-weight: 600; display: block; }
.checks .d { color: var(--chalk-2); font-size: 14px; margin-top: 2px; }
.checks code { font-family: var(--num); background: var(--turf-2); padding: 1px 6px; border-radius: 4px; color: var(--chalk); }
.waiting { display: flex; align-items: center; gap: 18px; padding: calc(var(--u) * 2) 0; }
.pulse { width: 14px; height: 14px; border-radius: 50%; background: var(--flag); animation: pulse 1.6s ease-in-out infinite; flex: none; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.75); } }
.readout { display: flex; gap: 48px; margin: calc(var(--u) * 1.6) 0 calc(var(--u) * 2); flex-wrap: wrap; }
.readout .v { font-family: var(--num); font-size: clamp(40px, 7vh, 64px); line-height: 1; font-weight: 600; }
.readout .u { font-size: 20px; color: var(--chalk-2); margin-left: 4px; }
.readout .k { color: var(--chalk-2); margin-top: 6px; }

/* bag: tap a chip to add a club; each club in the bag is a tile with its carry */
.clubs { display: grid; gap: calc(var(--u) * 0.9); margin: calc(var(--u) * 1.2) 0; }
.clubs .grp { display: grid; grid-template-columns: 80px 1fr; gap: 12px; align-items: center; }
.clubs .grp > span { color: var(--chalk-3); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--chalk-2); border-radius: 999px; padding: 5px 13px; cursor: pointer; font-family: var(--num); font-size: 15px; }
.chip:hover { border-color: var(--chalk-3); color: var(--chalk); }
.chip[aria-pressed="true"] { background: var(--chalk); color: var(--ink); border-color: var(--chalk); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; border-top: 1px solid var(--line); padding-top: calc(var(--u) * 1.4); }
.tile { background: var(--turf); border: 1px solid var(--line); border-radius: var(--r-m); padding: 8px 10px 10px; display: grid; gap: 4px; position: relative; }
.tile .club { font-family: var(--num); font-size: 19px; font-weight: 600; }
.tile .cls { font-size: 12px; color: var(--chalk-3); }
.tile input { width: 100%; padding: 6px 8px; font-family: var(--num); font-size: 17px; }
.tile .x { position: absolute; top: 4px; right: 4px; background: transparent; border: 0; color: var(--chalk-3); cursor: pointer; width: 24px; height: 24px; border-radius: 4px; }
.tile .x:hover { color: var(--chalk); background: var(--turf-2); }
.tile.missing { border-color: rgba(242, 193, 78, 0.6); }

.sessions { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin: calc(var(--u) * 1.6) 0 0; }
.choice { text-align: left; background: var(--turf); border: 1px solid var(--line); border-radius: var(--r-m); padding: calc(var(--u) * 1.4) 18px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.choice:hover { border-color: var(--chalk-3); }
.choice:disabled { opacity: 0.5; cursor: default; }
.choice h3 { margin: 0; font-family: var(--num); font-size: clamp(17px, 2.5vh, 22px); font-weight: 600; }
.choice p { margin: 0; color: var(--chalk-2); font-size: 14px; }
.choice .len { color: var(--chalk-3); font-size: 13px; margin-top: auto; padding-top: 4px; }
.choice.hero { border-color: rgba(242, 193, 78, 0.55); background: linear-gradient(180deg, rgba(242, 193, 78, 0.07), transparent 70%), var(--turf); }

/* ---------- practice ---------- */
.task { flex: none; display: grid; grid-template-columns: auto 1fr auto; gap: 32px; align-items: end; padding-bottom: calc(var(--u) * 1.4); border-bottom: 1px solid var(--line); margin-bottom: calc(var(--u) * 1.4); }
.task .club { font-family: var(--num); font-size: clamp(34px, 6.4vh, 60px); font-weight: 600; line-height: 0.95; white-space: nowrap; }
.task .club .to { color: var(--flag); }
.task .sub { color: var(--chalk-2); margin-top: 6px; }
.shots { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; padding-bottom: 6px; }
.shots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--chalk-3); display: block; }
.shots i.f { background: var(--chalk); border-color: var(--chalk); }
.shots i.c { border-color: var(--flag); box-shadow: 0 0 0 3px rgba(242, 193, 78, 0.18); }
.shots .count { font-family: var(--num); font-size: 22px; margin-left: 10px; white-space: nowrap; }
.task .side { text-align: right; }
.task .next { color: var(--chalk-2); margin-bottom: 8px; }
.task .ctl { display: flex; gap: 6px; justify-content: flex-end; }
.free { display: flex; gap: 10px; align-items: flex-end; }
.practice { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 26vw, 400px); grid-template-rows: minmax(0, 1fr); gap: 28px; }
.mapwrap { background: var(--turf); border-radius: var(--r-m); padding: 6px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.mapwrap .fill svg, .chartbox .fill svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.legend { flex: none; display: flex; gap: 18px; color: var(--chalk-3); font-size: 12.5px; padding: 6px 10px 2px; flex-wrap: wrap; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; }
.legend .sp { flex: 1; }
.sidecol { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.score .big { font-family: var(--num); font-size: clamp(44px, 8vh, 76px); font-weight: 600; line-height: 0.95; }
.score .pm { font-family: var(--num); font-size: clamp(18px, 3vh, 26px); color: var(--chalk-2); margin-left: 6px; }
.score .ci { color: var(--chalk-2); margin-top: 6px; font-size: 13.5px; }
.block { padding: calc(var(--u) * 1.3) 0; border-top: 1px solid var(--line); }
.block:first-child { border-top: 0; padding-top: 0; }
.split { margin-top: 8px; display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--turf-2); }
.split .a { background: var(--flag); }
.split .s { background: var(--chalk-2); }
.splitkey { display: flex; justify-content: space-between; color: var(--chalk-2); font-size: 13px; margin-top: 6px; }
.splitkey b { color: var(--chalk); font-family: var(--num); font-size: 16px; }
.outc { display: flex; gap: 28px; }
.outc .v { font-family: var(--num); font-size: clamp(26px, 4.4vh, 40px); font-weight: 600; }
.outc .of { font-family: var(--num); color: var(--chalk-2); margin-left: 6px; font-size: 16px; }
.outc .k { color: var(--chalk-2); font-size: 13px; }
.warnbox { color: var(--chalk); font-size: 13.5px; border-left: 3px solid var(--miss); padding-left: 12px; }
.warnbox b { color: var(--miss); }
.kv { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 6px 12px; font-size: 13.5px; margin: 0; align-items: baseline; }
.kv dt { color: var(--chalk-2); }
.kv dd { margin: 0; font-family: var(--num); font-size: 16px; text-align: right; white-space: nowrap; }
.last { display: flex; gap: 20px; align-items: baseline; }
.last .v { font-family: var(--num); font-size: clamp(22px, 3.4vh, 30px); font-weight: 600; white-space: nowrap; }
.last .k { color: var(--chalk-2); font-size: 12.5px; }
.ready { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* overlay: the shot list opens over the screen instead of growing the page */
.sheet { position: fixed; inset: 0; background: rgba(8, 14, 11, 0.72); display: grid; place-items: center; z-index: 30; }
.sheet .card { background: var(--ink); border: 1px solid var(--line); border-radius: var(--r-m); padding: 18px 20px; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 32px); display: flex; flex-direction: column; overflow: hidden; }
.sheet .card .row { justify-content: space-between; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: right; font-weight: 500; color: var(--chalk-3); padding: 6px 10px; border-bottom: 1px solid var(--line); }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--line); font-family: var(--num); font-size: 15px; }
table.t tr.x td { opacity: 0.38; text-decoration: line-through; }
table.t .btn { padding: 3px 10px; }

/* ---------- results / history ---------- */
.resulthead { flex: none; display: flex; justify-content: space-between; align-items: end; gap: 12px 20px; flex-wrap: wrap; }
.resulthead .row { gap: 8px; }
.resulthead .seg button { padding: 5px 11px; font-size: 13.5px; }
button.mini { border: 0; color: inherit; text-align: left; cursor: pointer; font: inherit; width: 100%; }
button.mini:hover { box-shadow: inset 0 0 0 1px var(--chalk-3); }
button.mini.weak:hover { box-shadow: inset 0 0 0 1px rgba(224, 122, 95, 0.9); }
.btn.danger { color: var(--miss); border-color: rgba(224, 122, 95, 0.6); }
.sheet .card.wide { width: min(1180px, calc(100vw - 32px)); }
.sheet .card .sp { flex: 1; }
table.t tr.flag td { color: var(--miss); }
table.t tfoot tr.avg td { border-top: 1px solid var(--chalk-3); border-bottom: 0; font-weight: 600; color: var(--chalk); padding-top: 8px; }
@media (max-width: 760px) { .sheet .card.wide table.t th:nth-child(5), .sheet .card.wide table.t td:nth-child(5), .sheet .card.wide table.t th:nth-child(10), .sheet .card.wide table.t td:nth-child(10), .sheet .card.wide table.t th:nth-child(11), .sheet .card.wide table.t td:nth-child(11) { display: none; } .sheet .card.wide table.t td, .sheet .card.wide table.t th { padding: 4px 4px; font-size: 12.5px; } }
.pickclubs { gap: 6px; margin-top: calc(var(--u) * 1); }
.pickclubs .chip { padding: 3px 11px; font-size: 14px; }
@media (max-width: 560px) { #datacount, .bagsetup, .baglead { display: none; } .datazone { margin-top: 6px !important; padding-top: 6px !important; } .datazone .btn { padding: 4px 8px; font-size: 13px; } }
.datazone { margin-top: calc(var(--u) * 2); padding-top: calc(var(--u) * 1.4); border-top: 1px solid var(--line); }
.verdict { flex: none; font-size: clamp(16px, 2.6vh, 22px); line-height: 1.4; max-width: 70ch; margin: calc(var(--u) * 0.4) 0 calc(var(--u) * 1.4); }
.verdict b { color: var(--miss); font-weight: 600; }
.verdict b.plain { color: var(--chalk); }
.chartbox { background: var(--turf); border-radius: var(--r-m); padding: 10px 12px 6px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.chartbox h2 { flex: none; margin: 2px 4px 4px; display: flex; gap: 12px; align-items: baseline; }
.chartbox h2 .faint { font-weight: 400; font-size: 13px; }
.results { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 20px; }
.results.single { grid-template-columns: minmax(0, 1fr); }
.minis { position: relative; min-height: 0; }
.minis .grid { position: absolute; inset: 0; display: grid; gap: 10px; align-content: start; justify-content: center; }
.mini { background: var(--turf); border-radius: var(--r-m); padding: 8px 10px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.mini .h { display: flex; justify-content: space-between; align-items: baseline; }
.mini .h b { font-family: var(--num); font-size: 17px; }
.mini .m { flex: 1; min-height: 0; position: relative; }
.mini .m svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mini .c { font-size: 12.5px; color: var(--chalk-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini.weak { box-shadow: inset 0 0 0 1px rgba(224, 122, 95, 0.6); }
.tag { font-size: 12px; color: var(--miss); border: 1px solid rgba(224, 122, 95, 0.5); border-radius: 999px; padding: 0 8px; }
.picker { flex: none; display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 calc(var(--u) * 1); }
.picker .chip { padding: 4px 12px; font-size: 14px; }
.hist { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.foot { flex: none; display: flex; gap: 16px; align-items: center; margin-top: calc(var(--u) * 1); color: var(--chalk-3); font-size: 13px; }
.foot .sp { flex: 1; }
.tabsel { display: none; }

/* Narrow windows (a phone, or a laptop window snapped to half the screen) trade side-by-side for tabs. */
@media (max-width: 1000px) {
  .top { gap: 10px; }
  .top .status span:last-child, .player > span, .debuglink { display: none; }
  .menu a { padding: 7px 9px; }
  .wizard { grid-template-columns: 1fr; gap: 8px; }
  .rail { display: flex; gap: 10px; }
  .rail li { padding: 0; font-size: 0; gap: 0; }
  .rail li.here { font-size: 15px; gap: 8px; }
  .task { grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; }
  .task .shots { grid-column: 1 / -1; grid-row: 2; }
  .task .next { display: none; }
  .task .sub { display: none; }
  .tabsel { display: inline-flex; flex: none; margin-bottom: calc(var(--u) * 1); align-self: flex-start; }
  .practice, .results { grid-template-columns: minmax(0, 1fr); }
  .practice > *, .results > * { grid-row: 1; grid-column: 1; }
  [data-tab-hidden="1"] { visibility: hidden; pointer-events: none; }
  .hist { grid-template-rows: minmax(0, 1fr); }
  .hist > * { grid-row: 1; grid-column: 1; }
}
@media (max-width: 560px) {
  :root { --top: 50px; }
  .brand { display: none; }
  .top { gap: 6px; }
  .player select { max-width: 84px; padding-right: 22px; font-size: 13px; }
  h1 { font-size: min(clamp(24px, 4.2vh, 40px), 7.4vw); }
  .pane .faint, .pane #trydemo + span { display: none; }
  .lead { font-size: 14px; }
  .menu a { padding: 6px 7px; font-size: 14px; }
  .fs { display: none; }
  .clubs .grp { grid-template-columns: 1fr; gap: 4px; }
  .clubs .grp > span { display: none; }
  .chip { padding: 3px 9px; font-size: 14px; }
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .tile { padding: 4px 6px 6px; }
  .tile .cls { display: none; }
  .tile .club { font-size: 16px; }
  .tile input { padding: 4px 6px; font-size: 15px; }
  .sessions { grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice { padding: 10px 12px; }
  .choice p { display: none; }
  .task .ctl .btn { padding: 6px 8px; font-size: 13px; }
  .task .ctl #skip { display: none; }
  .kv { grid-template-columns: 1fr auto; }
  .resulthead select { max-width: 150px; }
  .checks .d { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { .pulse, .ring { animation: none !important; } }
.ring { animation: ring 1.1s ease-out 1; transform-box: fill-box; transform-origin: center; }
@keyframes ring { 0% { opacity: 1; transform: scale(0.4); } 100% { opacity: 0; transform: scale(2.6); } }

/* practice stage: the 3D range and the top-down map share one box */
.viewbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 4px 6px; }
.viewbar .seg button { padding: 4px 12px; font-size: 13.5px; }
.viewbar .sp { flex: 1; }
.layer { position: absolute; inset: 0; }
.layer canvas { position: absolute; inset: 0; display: block; border-radius: 6px; }
#hudbox { position: absolute; left: 10px; right: 10px; bottom: 10px; pointer-events: none; }
.hud { display: flex; flex-wrap: wrap; gap: 4px 22px; background: rgba(11, 20, 16, 0.78); border: 1px solid rgba(43, 70, 55, 0.8); border-radius: 8px; padding: 8px 14px; width: fit-content; max-width: 100%; }
.hud .v { font-family: var(--num); font-size: clamp(16px, 2.6vh, 24px); font-weight: 600; white-space: nowrap; }
.hud .u { font-size: 12px; color: var(--chalk-2); margin-left: 2px; font-weight: 400; }
.hud .k { font-size: 11.5px; color: var(--chalk-3); }
.spark { position: relative; height: clamp(44px, 8vh, 86px); }
.spark svg { position: absolute; inset: 0; }
.demobar { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px var(--pad-x); background: #2a2612; border-bottom: 1px solid #4a4220; font-size: 13.5px; }
.demobar .sp { flex: 1; }
.demobar .btn { padding: 4px 11px; font-size: 13px; }
@media (max-width: 1000px) { .demobar > span:first-child { display: none; } .hud { gap: 2px 12px; padding: 6px 10px; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><line x1="5" y1="1" x2="5" y2="21" stroke="#eceee4" stroke-width="2"/><path d="M6 2 L18 6 L6 10 Z" fill="#f2c14e"/><ellipse cx="5" cy="21" rx="4.5" ry="1.2" fill="#7f8d7f"/></svg>Pattern</div>
  <nav class="menu" id="menu">
    <a href="#/practice">Practice</a>
    <a href="#/results">Results</a>
    <a href="#/history">History</a>
    <a href="#/bag">Bag</a>
  </nav>
  <div class="spacer"></div>
  <span id="upd"></span>
  <a class="status" href="#/setup/1" id="conn"><span class="dot"></span><span>Starting</span></a>
  <label class="player"><span class="faint">Player</span><select id="playerSel" aria-label="Player"></select></label>
  <button class="fs" id="fs" type="button"></button>
  <button class="debuglink quitbtn" id="quit" type="button" title="Stop Pattern. Shots are saved as they come in, so nothing is lost.">Quit</button>
  <a class="debuglink" href="/debug" title="Raw data, fields and connection details">Debug</a>
</header>
<main id="view"></main>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = (p) => fetch(p, { cache: 'no-store' }).then(r => r.json());
const post = (p, b) => fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) }).then(r => r.json());
const f = (v, d = 0) => (v == null || !isFinite(v)) ? '–' : Number(v).toFixed(d);
const clubName = (c) => { const u = String(c).toUpperCase(); const m = u.match(/^(\d)I$/); if (m) return m[1] + ' iron'; const w = u.match(/^(\d)W$/); if (w) return w[1] + ' wood'; const h = u.match(/^(\d)H$/); if (h) return h[1] + ' hybrid'; if (/^\d{2}$/.test(u)) return u + '°'; if (u === 'DRIVER' || u === 'DR') return 'Driver'; return c; };
const side = (x) => Math.abs(x) < 0.5 ? 'on line' : f(Math.abs(x), 0) + (x > 0 ? ' right' : ' left');
const depth = (y) => Math.abs(y) < 0.5 ? 'pin high' : f(Math.abs(y), 0) + (y > 0 ? ' long' : ' short');

let S = null;        // app state
let route = '';

// ---------------------------------------------------------------- header
async function refreshState() {
  try { S = await api('/api/state'); } catch { return; }
  const c = $('#conn');
  let cls = 'wait', txt = 'Waiting for launch monitor';
  if (S.lm.connected) { cls = 'ok'; txt = 'Launch monitor connected'; }
  else if (S.lm.seen) { cls = 'wait'; txt = 'Launch monitor idle'; }
  const fromGspro = !S.lm.connected && S.results.rows > 0;
  if (fromGspro) { cls = 'ok'; txt = 'Reading shots from GSPro'; }
  else if (S.sim.upstream && S.sim.listening === false) { cls = 'bad'; txt = 'GSPro not found'; }
  c.innerHTML = '<span class="dot ' + cls + '"></span><span>' + txt + '</span>';
  const sel = $('#playerSel');
  const opts = S.players.map(p => '<option' + (p === S.player ? ' selected' : '') + '>' + esc(p) + '</option>').join('') + '<option value="__new">Add a player…</option>';
  if (sel.dataset.v !== opts) { sel.innerHTML = opts; sel.dataset.v = opts; }
  paintDemo();
}
$('#playerSel').addEventListener('change', async (e) => {
  if (e.target.value === '__new') { e.target.value = S.player; addPlayerSheet(); return; }
  await post('/api/player', { name: e.target.value });
  await refreshState(); render();
});

async function checkUpdate() {
  try {
    const v = await api('/api/version');
    const u = $('#upd');
    if (v.updateAvailable) u.innerHTML = '<button class="update" id="doUpd" title="Installs ' + esc(v.latest) + ' and restarts">Update to ' + esc(v.latest) + '</button>';
    else u.innerHTML = '';
    const b = $('#doUpd');
    if (b) b.onclick = async () => {
      b.disabled = true; b.textContent = 'Updating…';
      const r = await post('/api/update');
      if (!r.ok) { b.textContent = 'Update failed'; b.title = r.reason || ''; return; }
      b.textContent = 'Restarting…';
      const t0 = Date.now();
      const wait = async () => { try { const nv = await api('/api/version'); if (nv.current === v.latest) { location.reload(); return; } } catch {} if (Date.now() - t0 < 60000) setTimeout(wait, 1500); else b.textContent = 'Restart it by hand'; };
      setTimeout(wait, 2500);
    };
  } catch { /* offline is fine */ }
}

// ---------------------------------------------------------------- router
function go(h) { location.hash = h; }
window.addEventListener('hashchange', render);
async function render() {
  if (!S) await refreshState();
  let h = location.hash || '';
  if (!h || h === '#' || h === '#/') h = S.onboarded ? '#/practice' : '#/setup/1';
  if (!S.onboarded && !h.startsWith('#/setup') && !h.startsWith('#/bag')) h = '#/setup/1';
  route = h;
  fitReset();
  if (!h.startsWith('#/practice')) { PR.key = ''; RANGE.canvas = null; }
  $$('#menu a').forEach(a => a.setAttribute('aria-current', h.startsWith(a.getAttribute('href')) ? 'page' : 'false'));
  const v = $('#view');
  if (h.startsWith('#/setup')) return renderSetup(v, Number(h.split('/')[2]) || 1);
  if (h.startsWith('#/practice')) return renderPractice(v);
  if (h.startsWith('#/results')) return renderResults(v);
  if (h.startsWith('#/history')) return renderHistory(v);
  if (h.startsWith('#/bag')) return renderBag(v);
}

// ---------------------------------------------------------------- setup wizard
const STEPS = ['Connect', 'Test shot', 'Direction', 'You', 'Bag', 'Start'];
let wiz = { refAtDirection: null, mapTried: 0, dirResult: null };

function rail(n) {
  return '<ol class="rail">' + STEPS.map((s, i) => {
    const k = i + 1, cls = k < n ? 'done' : k === n ? 'here' : '';
    return '<li class="' + cls + '"><span class="n">' + (k < n ? '✓' : k) + '</span>' + s + '</li>';
  }).join('') + '</ol>';
}

function check(state, title, detail) {
  const ic = state === 'ok' ? '✓' : state === 'bad' ? '!' : '…';
  return '<li><span class="ic ' + state + '">' + ic + '</span><div><b>' + title + '</b><div class="d">' + detail + '</div></div></li>';
}

let setupTimer = null, setupStep = 0;
const stepBody = (n) => n === 1 ? stepConnect() : n === 2 ? stepTest() : n === 3 ? stepDirection() : n === 4 ? stepYou() : n === 5 ? stepBag() : stepStart();
// Redraw only when the content actually changed, so nothing moves under the cursor.
function paintSetup() {
  const p = $('#pane');
  if (!p || !route.startsWith('#/setup/' + setupStep)) return;
  const h = stepBody(setupStep);
  if (p.dataset.h === h) return;
  p.innerHTML = h; p.dataset.h = h;
  wire(setupStep);
}
function renderSetup(v, n) {
  clearInterval(setupTimer);
  setupStep = n;
  v.innerHTML = '<div class="wizard">' + rail(n) + '<section class="pane" id="pane"></section></div>';
  paintSetup();
  if (n <= 3) setupTimer = setInterval(async () => {
    if (!route.startsWith('#/setup/' + n)) return clearInterval(setupTimer);
    await refreshState();
    if (n >= 2) { const r = await api('/api/preview'); wiz.preview = r.preview; if (n === 2 && !S.mapping.set) { const m = await post('/api/automap'); wiz.mapTried++; if (m.applied) await refreshState(); } }
    paintSetup();
  }, 1200);
}

function stepConnect() {
  const sim = S.sim, lm = S.lm, r = S.results;
  const proxy = sim.mode === 'proxy' || sim.mode === 'inline';
  return '<h1>Connect your launch monitor</h1>' +
    '<p class="lead">Pattern sits between your launch monitor and GSPro. Shots still reach GSPro exactly as before; Pattern just keeps a copy.</p>' +
    '<ul class="checks">' +
    check('ok', 'Pattern is running', 'Leave this window open while you practice.') +
    (proxy ? check(sim.listening ? 'ok' : sim.listening === false ? 'bad' : 'wait', 'GSPro is open',
      sim.listening ? 'GSPro is ready for a launch monitor.' : 'Nothing is answering on GSPro\'s port <code>921</code>. Open GSPro, then open <b>GSPro Connect</b> (it starts with GSPro) and choose your launch monitor there. Your connector has to reach GSPro on its own before Pattern can help.') : '') +
    check(lm.seen ? 'ok' : r.rows ? 'ok' : 'wait', lm.seen ? 'Your launch monitor is talking to Pattern' : r.rows ? 'Shots are coming from GSPro' : 'Your launch monitor is talking to Pattern',
      lm.seen ? 'Receiving shots' + (lm.device ? ' from ' + esc(lm.device) : '') + '.' :
      r.rows ? 'Pattern can score from GSPro\'s results alone. To add the launch monitor\'s own numbers (start line, spin, the 3D flight), set your connector\'s port to <code>9211</code> if it has that setting.' :
      'Either set your launch monitor\'s connector port from <code>921</code> to <code>9211</code>, or just hit a shot in GSPro: Pattern can also work from GSPro\'s results alone.') +
    check(r.files ? 'ok' : 'wait', 'GSPro\'s results are visible',
      r.files ? 'Found GSPro\'s shot data. Pattern reads it and never changes it.' : 'Pattern looks for this automatically. It usually turns green after your first shot.') +
    '</ul>' +
    '<div class="row"><button class="btn primary" id="next" ' + (lm.seen || r.rows ? '' : 'disabled') + '>Continue</button>' +
    (lm.seen || r.rows ? '' : '<span class="faint">Continue unlocks when a shot reaches Pattern, from the launch monitor or from GSPro.</span>') + '</div>' +
    (S.demo ? '<p class="dim" style="margin-top:calc(var(--u)*2)">In the demo, press <b>Connect the pretend monitor</b> in the yellow bar.</p>' : '<div class="row" style="margin-top:calc(var(--u)*2.4)"><button class="btn" id="trydemo">Try it with pretend shots</button><span class="faint">No launch monitor here? The demo runs everything with simulated shots, in its own window, without touching your data.</span></div><p class="faint" style="margin-top:calc(var(--u)*1.4)">Connector won\'t let you change the port? Open <a href="/debug">Debug</a> for the other ways to connect.</p>');
}

function stepTest() {
  const pv = wiz.preview;
  let h = '<h1>Hit one ball</h1><p class="lead">Any club, any swing. Pattern finds carry and offline in what GSPro sends back.</p>';
  if (!S.mapping.set) {
    h += '<div class="waiting"><span class="pulse"></span><div><b>Waiting for a shot</b><div class="dim">' + (wiz.mapTried > 2 ? 'A shot arrived but Pattern couldn\'t find carry and offline in it. Open <a href="/debug">Debug</a> to choose the fields by hand.' : 'Hit a ball when you\'re ready.') + '</div></div></div>';
    return h;
  }
  if (!pv || pv.carryYd == null) return h + '<div class="waiting"><span class="pulse"></span><div><b>Waiting for a shot</b><div class="dim">Hit a ball when you\'re ready.</div></div></div>';
  h += '<div class="readout"><div><div class="v">' + f(pv.carryYd, 1) + '<span class="u">yd</span></div><div class="k">Carry</div></div>' +
    '<div><div class="v">' + f(Math.abs(pv.offlineRawYd), 1) + '<span class="u">yd</span></div><div class="k">Offline</div></div>' +
    (pv.totalYd != null ? '<div><div class="v">' + f(pv.totalYd, 1) + '<span class="u">yd</span></div><div class="k">Total</div></div>' : '') + '</div>' +
    '<p>Do these match what GSPro shows for that shot?</p>' +
    '<div class="row"><button class="btn primary" id="next">Yes, they match</button><a class="btn quiet" href="/debug">No, choose fields by hand</a></div>';
  return h;
}

function stepDirection() {
  const pv = wiz.preview;
  const fresh = pv && pv.ref !== wiz.refAtDirection && pv.offlineRawYd != null;
  let h = '<h1>Which way is right?</h1><p class="lead">Launch monitors disagree on which side is plus. Hit one ball that clearly finishes right of where you aimed, then tell Pattern where it went.</p>';
  if (wiz.dirResult && wiz.dirResult.ok) return h + '<ul class="checks">' + check('ok', 'Got it', 'Right of the target now reads as right everywhere in Pattern.') + '</ul><button class="btn primary" id="next">Continue</button>';
  if (!fresh) return h + '<div class="waiting"><span class="pulse"></span><div><b>Waiting for that shot</b><div class="dim">Aim at something, and push or fade one well right of it.</div></div></div>' + (S.directionChecked ? '<button class="btn quiet" id="next">Skip, it was already checked</button>' : '');
  return h + '<div class="readout"><div><div class="v">' + f(Math.abs(pv.offlineRawYd), 1) + '<span class="u">yd</span></div><div class="k">Offline, that shot</div></div></div>' +
    (wiz.dirResult && !wiz.dirResult.ok ? '<p class="err">' + esc(wiz.dirResult.reason) + '</p>' : '') +
    '<p>Where did it finish?</p><div class="row"><button class="btn" data-went="left">Left of target</button><button class="btn primary" data-went="right">Right of target</button></div>';
}

function stepYou() {
  const st = S.setup;
  return '<h1>Who\'s hitting?</h1><p class="lead">Each player gets their own bag, history and scores. Switch players any time from the top bar.</p>' +
    '<div class="stack" style="max-width:520px">' +
    '<label class="field"><span>Name</span><input class="input" id="pname" value="' + esc(S.player === 'Player 1' ? '' : S.player) + '" placeholder="Your name" autocomplete="off"></label>' +
    '<div class="field"><span>Hand</span><div class="seg" id="hand"><button type="button" data-h="R" aria-pressed="' + (S.handed !== 'L') + '">Right-handed</button><button type="button" data-h="L" aria-pressed="' + (S.handed === 'L') + '">Left-handed</button></div></div>' +
    '</div>' +
    '<h2 style="margin-top:34px">This setup</h2><p class="dim">Scores are only compared between players when these match, because a different simulator version or setting is a different test.</p>' +
    '<div class="row" style="align-items:flex-start;max-width:760px">' +
    '<label class="field" style="flex:1 1 200px"><span>GSPro version</span><input class="input" id="sver" value="' + esc(st.simVersion) + '" placeholder="From GSPro\'s settings"></label>' +
    '<label class="field" style="flex:1 1 200px"><span>Launch monitor firmware</span><input class="input" id="sfw" value="' + esc(st.deviceFw) + '" placeholder="From the monitor\'s app"></label>' +
    '<label class="field" style="flex:2 1 320px"><span>Conditions</span><input class="input" id="scond" value="' + esc(st.conditions) + '"></label></div>' +
    '<div class="row" style="margin-top:28px"><button class="btn primary" id="next">Continue</button></div>';
}

const CLUB_GROUPS = [
  ['Woods', ['Driver', '3W', '5W', '7W']],
  ['Hybrids', ['2H', '3H', '4H', '5H']],
  ['Irons', ['3i', '4i', '5i', '6i', '7i', '8i', '9i']],
  ['Wedges', ['PW', 'GW', 'SW', 'LW', '48', '50', '52', '54', '56', '58', '60']],
];
const classOf = (c) => { const u = c.toUpperCase(); if (u === 'DRIVER') return 'driver'; if (/^(PW|GW|SW|LW|AW|\d{2})$/.test(u)) return 'wedge'; if (/W$/.test(u)) return 'wood'; if (/H$/.test(u)) return 'hybrid'; const n = +u[0]; return n >= 8 ? 'short_iron' : n >= 5 ? 'mid_iron' : 'long_iron'; };
const classLabel = { driver: 'Driver', wood: 'Wood', hybrid: 'Hybrid', long_iron: 'Long iron', mid_iron: 'Mid iron', short_iron: 'Short iron', wedge: 'Wedge' };
let bagDraft = null;

function bagEditor() {
  if (!bagDraft) bagDraft = (S.bag || []).map(b => ({ ...b }));
  const has = (c) => bagDraft.some(b => b.club === c);
  const order = CLUB_GROUPS.flatMap(g => g[1]);
  bagDraft.sort((a, b) => order.indexOf(a.club) - order.indexOf(b.club));
  return '<div class="clubs">' + CLUB_GROUPS.map(([g, cs]) => '<div class="grp"><span>' + g + '</span><div class="chips">' +
      cs.map(c => '<button type="button" class="chip" data-club="' + c + '" aria-pressed="' + has(c) + '">' + c + '</button>').join('') + '</div></div>').join('') + '</div>' +
    (bagDraft.length ? '<div class="tiles">' + bagDraft.map(b => '<label class="tile' + (b.stockYd > 0 ? '' : ' missing') + '"><span class="club">' + esc(b.club) + '</span><span class="cls">' + (b.totalYd ? 'Stops at ' + b.totalYd : classLabel[b.clubClass] + ' carry') + '</span><input class="input num" type="number" min="1" max="420" inputmode="numeric" data-yd="' + esc(b.club) + '" value="' + (b.stockYd || '') + '" placeholder="carry, yd" aria-label="' + esc(b.club) + ' carry in yards"><button type="button" class="x" data-rm="' + esc(b.club) + '" aria-label="Remove ' + esc(b.club) + '">×</button></label>').join('') + '</div>' :
      '<p class="faint">Tap the clubs you carry.</p>');
}

function wireBag(root) {
  $$('.chip', root).forEach(b => b.onclick = () => {
    const c = b.dataset.club;
    if (bagDraft.some(x => x.club === c)) bagDraft = bagDraft.filter(x => x.club !== c);
    else bagDraft.push({ club: c, clubClass: classOf(c), stockYd: 0 });
    redrawBag(root);
  });
  $$('[data-rm]', root).forEach(b => b.onclick = () => { bagDraft = bagDraft.filter(x => x.club !== b.dataset.rm); redrawBag(root); });
  $$('[data-yd]', root).forEach(i => i.oninput = () => { const x = bagDraft.find(b => b.club === i.dataset.yd); if (x) x.stockYd = Number(i.value) || 0; i.closest('.tile').classList.toggle('missing', !(x && x.stockYd > 0)); validateBag(root); });
  validateBag(root);
}
function redrawBag(root) { const box = $('#bagbox', root); box.innerHTML = bagEditor(); wireBag(root); }
function validateBag(root) {
  const ok = bagDraft.length > 0 && bagDraft.every(b => b.stockYd > 0);
  const btn = $('#savebag', root);
  if (btn) btn.disabled = !ok;
  const msg = $('#bagmsg', root);
  if (msg) msg.textContent = !bagDraft.length ? '' : ok ? '' : 'Enter a carry for every club.';
}

function stepBag() {
  bagDraft = null;
  return '<h1>What\'s in the bag?</h1><p class="lead">Tap the clubs you carry, then enter how far each one carries on a good strike. A guess is fine: "Find my real numbers" measures them next.</p>' +
    '<div id="bagbox">' + bagEditor() + '</div>' +
    '<div class="row" style="margin-top:24px"><button class="btn primary" id="savebag">Continue</button><span class="faint" id="bagmsg"></span></div>';
}

// Which clubs the next session uses (empty means the whole bag), and how many shots each (0 means the session's usual number).
let PICK = new Set(), SHOTS = 0;
const SHOT_CHOICES = [1, 3, 5, 10, 20];
function clubPicker() {
  const bag = S.bag || [];
  if (bag.length < 2) return '';
  return '<div class="row pickclubs"><span class="dim">Clubs</span><button type="button" class="chip" data-pick="__all" aria-pressed="' + (PICK.size === 0) + '">Whole bag</button>' +
    bag.map(b => '<button type="button" class="chip" data-pick="' + esc(b.club) + '" aria-pressed="' + PICK.has(b.club) + '">' + esc(b.club) + '</button>').join('') + '</div>' +
    '<div class="row pickclubs"><span class="dim">Shots per club</span><button type="button" class="chip" data-shots="0" aria-pressed="' + (SHOTS === 0) + '">Usual</button>' +
    SHOT_CHOICES.map(n => '<button type="button" class="chip" data-shots="' + n + '" aria-pressed="' + (SHOTS === n) + '">' + n + '</button>').join('') + (SHOTS && SHOTS < 3 ? '<span class="faint">Scores need 3 shots of a club; with fewer you get the numbers but no score.</span>' : '') + '</div>';
}
function wirePicker(root, redraw) {
  $$('[data-pick]', root).forEach(b => b.onclick = () => { const c = b.dataset.pick; if (c === '__all') PICK = new Set(); else if (PICK.has(c)) PICK.delete(c); else PICK.add(c); redraw(); });

function sessionChoices(hero) {

    c('discovery', 'Find my real numbers', 'A few full swings with each club at the flag. Pattern learns how far each club carries and where it stops.', n * per(5) + ' shots, about ' + mins(n * per(5))) +
    c('baseline', 'Bag check', 'Every club to its number. Ranks them and tells you which one to practice.', n * per(10) + ' shots, about ' + mins(n * per(10))) +
    c('ladder', 'Wedge ladder', 'Each wedge at quarter, half, three-quarter and full swings. Distance control is where scoring happens.', wedges ? wedges * 4 * per(10) + ' shots' : 'Needs wedges in your bag', wedges ? '' : ' disabled') +
    c('shapes', 'Stock, draw and fade', 'Every club three ways. Shows which shapes you can actually call on.', n * 3 * per(10) + ' shots') +

function stepStart() {

// ---------------------------------------------------------------- the map
// A mown fairway: stripes every 5 yards of carry are also the scale.
function fd(xs) {
  const s = [...xs].sort((a, b) => a - b), n = s.length;
  if (n < 4) return 2;
  const q = (p) => s[Math.min(n - 1, Math.max(0, Math.round(p * (n - 1))))];
  const iqr = q(0.75) - q(0.25);
  return Math.max(1, Math.min(10, 2 * iqr / Math.cbrt(n) || 2));
}

function drawMap(o) {
  // o: { shots:[{x, carry, last}], target, ell:[{p,rx,ry,theta,cx,cy}], center:{x,y}, W, H, mini }
  const W = o.W || 900, H = o.H || 640, mini = !!o.mini;
  const histT = mini ? 0 : 56, histR = mini ? 0 : 64, axisL = mini ? 0 : 46, axisB = mini ? 0 : 30, padT = mini ? 6 : 10;
  const pw = W - axisL - histR - (mini ? 12 : 18), ph = H - histT - axisB - padT - (mini ? 6 : 8);
  const xs = o.shots.map(s => s.x), ys = o.shots.map(s => s.carry);
  let hx = 8, ylo = o.target - 8, yhi = o.target + 8;
  for (const s of o.shots) { hx = Math.max(hx, Math.abs(s.x) * 1.15 + 1); ylo = Math.min(ylo, s.carry - 3); yhi = Math.max(yhi, s.carry + 3); }
  for (const e of o.ell || []) {
    const t = e.theta * Math.PI / 180, ex = Math.sqrt((e.rx * Math.cos(t)) ** 2 + (e.ry * Math.sin(t)) ** 2), ey = Math.sqrt((e.rx * Math.sin(t)) ** 2 + (e.ry * Math.cos(t)) ** 2);
    hx = Math.max(hx, Math.abs(o.center.x) + ex + 1); ylo = Math.min(ylo, o.center.y - ey - 1); yhi = Math.max(yhi, o.center.y + ey + 1);
  }
  // Equal scale on both axes, so the pattern's real shape shows.
  let sx = pw / (2 * hx), sy = ph / (yhi - ylo);
  const s = Math.min(sx, sy);
  hx = pw / (2 * s);
  const ymid = (ylo + yhi) / 2, yspan = ph / s;
  ylo = ymid - yspan / 2; yhi = ymid + yspan / 2;
  const X = (x) => axisL + pw / 2 + x * s, Y = (y) => padT + histT + (yhi - y) * s;
  let g = '';
  // mow stripes and carry labels
  const step = yspan > 120 ? 10 : 5;
  const first = Math.floor(ylo / step) * step;
  for (let y = first, i = 0; y < yhi + step; y += step, i++) {
    const top = Y(Math.min(y + step, yhi)), bot = Y(Math.max(y, ylo));
    if (bot - top > 0) g += '<rect x="' + axisL + '" y="' + top + '" width="' + pw + '" height="' + (bot - top) + '" fill="' + ((Math.floor(y / step) % 2) ? 'var(--mow)' : 'var(--turf-2)') + '"/>';
    if (!mini && y >= ylo && y <= yhi) g += '<text x="' + (axisL - 8) + '" y="' + (Y(y) + 4) + '" text-anchor="end" font-size="12" fill="var(--chalk-3)" font-family="var(--num)">' + y + '</text>';
  }
  // offline lines
  const xstep = hx > 40 ? 10 : 5;
  for (let x = -Math.floor(hx / xstep) * xstep; x <= hx; x += xstep) {
    g += '<line x1="' + X(x) + '" y1="' + (padT + histT) + '" x2="' + X(x) + '" y2="' + (padT + histT + ph) + '" stroke="' + (x === 0 ? 'rgba(236,238,228,0.28)' : 'rgba(236,238,228,0.07)') + '" stroke-width="1"' + (x === 0 ? ' stroke-dasharray="2 5"' : '') + '/>';
    if (!mini) g += '<text x="' + X(x) + '" y="' + (padT + histT + ph + 20) + '" text-anchor="middle" font-size="12" fill="var(--chalk-3)" font-family="var(--num)">' + (x === 0 ? '0' : Math.abs(x) + (x < 0 ? ' L' : ' R')) + '</text>';
  }
  // pattern ellipses (outer first)
  const ell = [...(o.ell || [])].sort((a, b) => b.p - a.p);
  for (const e of ell) {
    const cx = X(o.center.x), cy = Y(o.center.y);
    const outer = e.p >= 0.85;
    g += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + e.rx * s + '" ry="' + e.ry * s + '" transform="rotate(' + (-e.theta) + ' ' + cx + ' ' + cy + ')" fill="rgba(236,238,228,' + (outer ? 0.05 : 0.09) + ')" stroke="rgba(236,238,228,' + (outer ? 0.45 : 0.7) + ')" stroke-width="' + (mini ? 1 : 1.4) + '"' + (outer ? ' stroke-dasharray="5 5"' : '') + '/>';
  }
  if (o.center && (o.ell || []).length) {
    const cx = X(o.center.x), cy = Y(o.center.y), k = mini ? 4 : 7;
    g += '<path d="M' + (cx - k) + ' ' + cy + 'H' + (cx + k) + 'M' + cx + ' ' + (cy - k) + 'V' + (cy + k) + '" stroke="var(--chalk)" stroke-width="1.6"/>';
  }
  // flagstick at the target
  const fx = X(0), fy = Y(o.target);
  g += '<ellipse cx="' + fx + '" cy="' + fy + '" rx="' + (mini ? 3 : 5) + '" ry="' + (mini ? 1.5 : 2.5) + '" fill="#0b130e"/>';
  g += '<line x1="' + fx + '" y1="' + fy + '" x2="' + fx + '" y2="' + (fy - (mini ? 16 : 30)) + '" stroke="var(--chalk)" stroke-width="' + (mini ? 1.2 : 1.8) + '"/>';
  g += '<path d="M' + fx + ' ' + (fy - (mini ? 16 : 30)) + 'l' + (mini ? 10 : 16) + ' ' + (mini ? 3.5 : 5.5) + 'l-' + (mini ? 10 : 16) + ' ' + (mini ? 3.5 : 5.5) + 'z" fill="var(--flag)"/>';
  // shots
  o.shots.forEach(p => {
    if (p.x < -hx || p.x > hx || p.carry < ylo || p.carry > yhi) return;
    const cx = X(p.x), cy = Y(p.carry);
    if (p.last && !mini) {
      g += '<circle class="ring" cx="' + cx + '" cy="' + cy + '" r="7" fill="none" stroke="var(--flag)" stroke-width="2"/>';
      g += '<circle cx="' + cx + '" cy="' + cy + '" r="7.5" fill="var(--chalk)" stroke="var(--flag)" stroke-width="2.5"/>';
    } else g += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (mini ? 3 : 5.2) + '" fill="var(--chalk)" fill-opacity="' + (p.out ? 0.5 : 0.92) + '" stroke="#0b130e" stroke-width="1"/>';
  });
  // marginal distributions
  if (!mini && o.shots.length >= 2 && o.shots.length < 15) {
    // Too few shots for honest bars: a tick per shot plus a smooth density (Silverman bandwidth).
    const kde = (vals, lo, hi, k) => {
      const n = vals.length, mu = vals.reduce((a, b) => a + b, 0) / n;
      const sd = Math.sqrt(vals.reduce((a, b) => a + (b - mu) ** 2, 0) / Math.max(1, n - 1));
      const q = [...vals].sort((a, b) => a - b), iqr = q[Math.floor(0.75 * (n - 1))] - q[Math.floor(0.25 * (n - 1))];
      const h = Math.max(0.9 * Math.min(sd, iqr > 0 ? iqr / 1.34 : sd) * Math.pow(n, -0.2), (hi - lo) / 25);
      const out = [];
      for (let i = 0; i <= k; i++) { const t = lo + (hi - lo) * i / k; out.push([t, vals.reduce((a, v) => a + Math.exp(-0.5 * ((t - v) / h) ** 2), 0)]); }
      return out;
    };
    const dx = kde(xs, -hx, hx, 120), mdx = Math.max(...dx.map(d => d[1]), 1e-9), base = padT + histT - 6, hh = histT - 18;
    g += '<path d="M' + X(-hx) + ' ' + base + dx.map(([t, d]) => 'L' + X(t) + ' ' + (base - d / mdx * hh)).join('') + 'L' + X(hx) + ' ' + base + 'Z" fill="rgba(236,238,228,0.14)" stroke="var(--chalk-2)" stroke-width="1.3"/>';
    xs.forEach(x => { if (Math.abs(x) <= hx) g += '<line x1="' + X(x) + '" y1="' + base + '" x2="' + X(x) + '" y2="' + (base + 6) + '" stroke="var(--chalk)" stroke-width="1.6"/>'; });
    g += '<text x="' + axisL + '" y="' + (padT + 10) + '" font-size="12" fill="var(--chalk-3)">Offline</text>';
    const rx0 = axisL + pw + 8, ww = histR - 20, dy = kde(ys, ylo, yhi, 120), mdy = Math.max(...dy.map(d => d[1]), 1e-9);
    g += '<path d="M' + rx0 + ' ' + Y(ylo) + dy.map(([t, d]) => 'L' + (rx0 + 6 + d / mdy * ww) + ' ' + Y(t)).join('') + 'L' + rx0 + ' ' + Y(yhi) + 'Z" fill="rgba(236,238,228,0.14)" stroke="var(--chalk-2)" stroke-width="1.3"/>';
    ys.forEach(y => { if (y >= ylo && y <= yhi) g += '<line x1="' + rx0 + '" y1="' + Y(y) + '" x2="' + (rx0 + 6) + '" y2="' + Y(y) + '" stroke="var(--chalk)" stroke-width="1.6"/>'; });
    g += '<line x1="' + rx0 + '" y1="' + Y(o.target) + '" x2="' + (rx0 + histR - 14) + '" y2="' + Y(o.target) + '" stroke="var(--flag)" stroke-width="1.5"/>';
    g += '<text x="' + (rx0) + '" y="' + (padT + histT - 4) + '" font-size="12" fill="var(--chalk-3)">Carry</text>';
  }
  if (!mini && o.shots.length >= 15) {
    const bwx = fd(xs), bwy = fd(ys);
    const bins = (vals, lo, hi, bw) => { const n = Math.max(1, Math.ceil((hi - lo) / bw)); const c = new Array(n).fill(0); vals.forEach(v => { const i = Math.floor((v - lo) / bw); if (i >= 0 && i < n) c[i]++; }); return { c, n }; };
    const bx = bins(xs, -hx, hx, bwx), mx = Math.max(...bx.c, 1);
    bx.c.forEach((c, i) => { if (!c) return; const x0 = X(-hx + i * bwx), x1 = X(-hx + (i + 1) * bwx), h = (c / mx) * (histT - 14); g += '<rect x="' + (x0 + 1) + '" y="' + (padT + histT - 6 - h) + '" width="' + Math.max(1, x1 - x0 - 2) + '" height="' + h + '" rx="2" fill="var(--chalk-2)" fill-opacity="0.75"/>'; });
    g += '<text x="' + axisL + '" y="' + (padT + 10) + '" font-size="12" fill="var(--chalk-3)">Offline</text>';
    const by = bins(ys, ylo, yhi, bwy), my = Math.max(...by.c, 1), rx0 = axisL + pw + 8;
    by.c.forEach((c, i) => { if (!c) return; const y0 = Y(ylo + i * bwy), y1 = Y(ylo + (i + 1) * bwy), w = (c / my) * (histR - 18); g += '<rect x="' + rx0 + '" y="' + (y1 + 1) + '" width="' + w + '" height="' + Math.max(1, y0 - y1 - 2) + '" rx="2" fill="var(--chalk-2)" fill-opacity="0.75"/>'; });
    g += '<line x1="' + rx0 + '" y1="' + Y(o.target) + '" x2="' + (rx0 + histR - 14) + '" y2="' + Y(o.target) + '" stroke="var(--flag)" stroke-width="1.5"/>';
    g += '<text x="' + (rx0) + '" y="' + (padT + histT - 4) + '" font-size="12" fill="var(--chalk-3)">Carry</text>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Where your shots landed relative to the target">' + g + '</svg>';
}

function mapData(sc, label, shots, lastId) {
  const m = sc && sc.metrics;
  const disc = m && m.mode === 'discovery';
  const usable = shots.filter(s => s.complete && !s.excluded);
  const pts = usable.map(s => ({ x: s.scoreX ?? s.offlineYd, carry: s.scoreY ?? s.carryYd, last: s.id === lastId }));
  const YD = 0.9144;
  const ell = m ? sc.contours.filter(c => c.p === 0.5 || c.p === 0.9).map(c => ({ p: c.p, rx: c.ra / YD, ry: c.rb / YD, theta: c.thetaDeg })) : [];
  const center = m ? { x: m.muX / YD, y: label.targetYd + (disc ? m.depthOffset / YD : 0) + m.muY / YD } : null;
  return { shots: pts, target: label.targetYd, ell, center };
}

// ---------------------------------------------------------------- practice

function caddie(m, why, label) {
  if (!m) return '';
  const YD = 0.9144, mx = m.muX / YD, my = m.muY / YD;
  const disc = m.mode === 'discovery';
  const out = [];
  if (disc) {
    out.push((label.measure === 'finish' ? 'This club usually stops ' : 'This club really carries ') + f(label.targetYd + m.depthOffset / YD, 0) + ' yards out' + (Math.abs(m.depthOffset / YD) >= 2 ? ', not ' + f(label.targetYd, 0) : '') + '.');
  } else {
    const aimShare = m.piQ > 0 ? (m.piB * m.piB) / (m.piQ * m.piQ) : 0;
    const gain = m.piQ > 0 ? 1 - m.piS / m.piQ : 0;
    if (aimShare >= 0.35 && (Math.abs(mx) >= 1.5 || Math.abs(my) >= 1.5)) {
      out.push('Your pattern sits ' + [Math.abs(mx) >= 1 ? side(mx) : '', Math.abs(my) >= 1 ? depth(my) : ''].filter(Boolean).join(' and ') + '. Aiming to cancel that would cut your miss by ' + f(gain * 100, 0) + '%.');
    } else {
      out.push('Your aim is fine; the spread is the leak' + (Math.abs(mx) >= 1.5 || Math.abs(my) >= 1.5 ? ' (centre ' + [Math.abs(mx) >= 1 ? side(mx) : '', Math.abs(my) >= 1 ? depth(my) : ''].filter(Boolean).join(', ') + ')' : '') + '.');
    }
  }
  const off = why && why.offline;
  if (off && off.drivers.every(d => d.share > -0.05 && d.share < 1.05)) {
    const st = off.drivers.find(d => d.name === 'startLine'), cv = off.drivers.find(d => d.name === 'spinAxis');
    if (st && cv) out.push(st.share >= cv.share ? 'Most of your sideways miss is start line (' + f(st.share * 100, 0) + '%), not curve.' : 'Most of your sideways miss is curve (' + f(cv.share * 100, 0) + '%), not start line.');
  }
  if (m.tiltSignificant) out.push(m.thetaDeg < 0 ? 'Your misses run long-left to short-right.' : 'Your misses run long-right to short-left.');
  return out.join(' ');
}

// ---------------------------------------------------------------- sizing
// Every chart is drawn at the size of the box it sits in, and redrawn when the window changes,
// so screens fill the window exactly and nothing ever scrolls.
let FIT = [];
function fitReset() { FIT = []; }
function fitBox(el, draw) {
  if (!el) return;
  let last = '';
  const run = (force) => { if (!el.isConnected) return; const r = el.getBoundingClientRect(); if (r.width < 8 || r.height < 8) return; const k = Math.floor(r.width) + 'x' + Math.floor(r.height); if (k === last && force === false) return; last = k; el.innerHTML = draw(Math.floor(r.width), Math.floor(r.height)); };
  FIT.push(run); run();
  if (window.ResizeObserver) new ResizeObserver(() => run(false)).observe(el);
}
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => { FIT.forEach(f => f()); if (RANGE.canvas) RANGE.resize(); }, 60); });

// ---------------------------------------------------------------- full screen
function paintFs() {
  const on = !!document.fullscreenElement, b = $('#fs');
  if (!b) return;
  b.title = on ? 'Exit full screen (Esc)' : 'Full screen (F)';
  b.setAttribute('aria-label', b.title);
  b.innerHTML = on
    ? '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 1v5H1M10 1v5h5M6 15v-5H1M10 15v-5h5"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 6V1h5M15 6V1h-5M1 10v5h5M15 10v5h-5"/></svg>';
}
function toggleFs() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
}
document.addEventListener('fullscreenchange', paintFs);
document.addEventListener('keydown', (e) => {
  const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA');
  if (!typing && (e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); toggleFs(); }
  if (e.key === 'Escape') { const sh = $('.sheet'); if (sh) sh.remove(); }
});

// ---------------------------------------------------------------- terrain colours and smoothing
// Low ground is dark turf, the peak is flag yellow: the brighter it is, the more of you is there.
const RAMP = ['#1b3326', '#20402e', '#274f36', '#2f5f3e', '#3a7047', '#4a8250', '#5f9558', '#7ba860', '#9cba69', '#c3c873', '#f2c14e'];
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
const RAMP_RGB = RAMP.map(hex);
function rampAt(f) {
  const x = Math.max(0, Math.min(1, f)) * (RAMP.length - 1), i = Math.min(RAMP.length - 2, Math.floor(x)), u = x - i;
  const a = RAMP_RGB[i], b = RAMP_RGB[i + 1];
  return 'rgb(' + a.map((v, k) => Math.round(v + (b[k] - v) * u)).join(',') + ')';
}
/** Monotone cubic through the points (Fritsch-Carlson): smooth, and never overshoots what was measured. */
function mono(xs, ys) {
  const n = xs.length;
  if (n === 1) return () => ys[0];
  const h = [], d = [];
  for (let i = 0; i < n - 1; i++) { h.push(xs[i + 1] - xs[i]); d.push((ys[i + 1] - ys[i]) / (h[i] || 1)); }
  const m = new Array(n);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) m[i] = 0;
    else { const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]); }
  }
  return (x) => {
    if (x <= xs[0]) return ys[0];
