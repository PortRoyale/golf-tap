name: release

# Push a tag like v1.0.1 (matching APP_VERSION in tap.ts) and this builds the
# Windows, macOS and Linux programs, tests them, and publishes a GitHub Release.
# The in-app Update button downloads from the latest release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23'
      - name: Tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(grep -oP "APP_VERSION = '\K[^']+" tap.ts)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but tap.ts says v$v"; exit 1; }
      - run: node --no-warnings build-ui.ts
      - run: node --no-warnings --test engine.test.ts physics.test.ts

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23'
      - run: node --no-warnings build-ui.ts
      - name: Compile
        run: |
          mkdir -p dist
          bun build tap.ts --compile --minify --target=bun-windows-x64 --outfile dist/golf-tap.exe
          bun build tap.ts --compile --minify --target=bun-darwin-arm64 --outfile dist/golf-tap-macos-arm64
          bun build tap.ts --compile --minify --target=bun-darwin-x64 --outfile dist/golf-tap-macos-x64
          bun build tap.ts --compile --minify --target=bun-linux-x64 --outfile dist/golf-tap-linux-x64
      - name: Smoke test the Linux build
        run: |
          mkdir smoke && cd smoke
          ../dist/golf-tap-linux-x64 --listen 19211 --ui 18080 --no-upstream --no-browser > out.txt 2>&1 &
          pid=$!
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:18080/api/state > state.json && break; sleep 0.25; done
          curl -fs http://127.0.0.1:18080/ | grep -q '<title>'
          curl -fs http://127.0.0.1:18080/fonts/Inter-Regular.otf -o /dev/null
          kill $pid || true
          cat out.txt
          grep -q '"player"' state.json
          ls sqe.db
      - name: Checksums
        run: cd dist && for f in *; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done && ls -la
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: golf-tap
          path: dist/
