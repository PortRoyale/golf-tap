name: release

# Every push to main is tested and built. When APP_VERSION in tap.ts names a version
# that has no release yet, the Windows, macOS and Linux programs are published as
# release v<APP_VERSION>. The in-app Update button downloads from the latest release.
# To ship: bump APP_VERSION, push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23'
      - run: node --no-warnings build-ui.ts
      - run: node --no-warnings --test engine.test.ts physics.test.ts rollout.test.ts

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP "APP_VERSION = '\K[^']+" tap.ts)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23'
      - run: node --no-warnings build-ui.ts
      - name: Compile
        run: |
          mkdir -p dist
          bun build tap.ts --compile --minify --target=bun-windows-x64 --outfile dist/golf-tap.exe
          bun build tap.ts --compile --minify --target=bun-darwin-arm64 --outfile dist/golf-tap-macos-arm64
          bun build tap.ts --compile --minify --target=bun-darwin-x64 --outfile dist/golf-tap-macos-x64
          bun build tap.ts --compile --minify --target=bun-linux-x64 --outfile dist/golf-tap-linux-x64
      - name: Smoke test the Linux build
        run: |
          mkdir smoke && cd smoke
          cp ../dist/golf-tap-linux-x64 .
          ./golf-tap-linux-x64 --listen 19211 --ui 18080 --no-upstream --no-browser > out.txt 2>&1 &
          pid=$!
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:18080/api/state > state.json && break; sleep 0.25; done
          curl -fs http://127.0.0.1:18080/ | grep -q '<title>'
          curl -fs http://127.0.0.1:18080/fonts/inter-400 -o /dev/null
          kill $pid || true
          cat out.txt
          grep -q '"player"' state.json
          ls sqe.db   # data lives next to the program, here the copy in smoke/
      - name: Checksums
        run: cd dist && for f in *; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done && ls -la
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.new == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.new != 'true'
        with:
          name: golf-tap
          path: dist/
